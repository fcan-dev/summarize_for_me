<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <!-- No custom header: Chrome's side panel already renders the extension
       name and icon in its native title bar. -->
  <section id="page-info" class="hidden">
    <span id="page-favicon" class="page-favicon" aria-hidden="true"></span>
    <div class="page-body">
      <div id="page-title"></div>
      <div id="page-meta"></div>
    </div>
  </section>

  <section id="controls">
    <div id="endpoint-switch" role="group" aria-label="Endpoint to use">
      <button id="ep-btn-1" type="button" aria-pressed="true">Endpoint 1</button>
      <button id="ep-btn-2" type="button" aria-pressed="false">Endpoint 2</button>
    </div>
    <button id="btn-summarize">Summarize current page</button>
    <button id="btn-rerun" class="hidden">Re-summarize</button>
    <button id="btn-stop" class="hidden">Stop</button>
  </section>

  <section id="status" class="status" aria-live="polite"></section>
  <div id="queue-info" class="queue-info hidden"></div>
  <div id="empty-state" class="empty-state hidden">
    <div class="empty-title">No summary yet</div>
    <div>Summarize the current page to get started.</div>
  </div>
  <section id="summary" class="markdown"></section>

  <section id="chat" class="hidden" aria-label="Ask about this page">
    <div id="chat-head">
      <span id="chat-title">Ask about this page</span>
      <button id="btn-chat-new" type="button" title="Start a new conversation">New chat</button>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-input-row">
      <input id="chat-input" type="text" placeholder="Ask a question about this page…" autocomplete="off" />
      <button id="btn-chat-send" type="button">Send</button>
    </div>
  </section>

  <details id="history">
    <summary>History</summary>
    <ul id="history-list"></ul>
  </details>

  <details id="settings">
    <summary>Settings</summary>
    <div class="endpoint-group">
      <div class="endpoint-title">Endpoint 1</div>
      <div class="field">
        <label for="set-baseurl-1">Base URL</label>
        <input id="set-baseurl-1" type="text" spellcheck="false" />
      </div>
      <div class="field">
        <label for="set-apikey-1">API key</label>
        <input id="set-apikey-1" type="password" spellcheck="false" />
      </div>
      <div class="field">
        <label for="set-model-1">Model</label>
        <input id="set-model-1" type="text" spellcheck="false" />
      </div>
    </div>
    <div class="endpoint-group">
      <div class="endpoint-title">Endpoint 2</div>
      <div class="field">
        <label for="set-baseurl-2">Base URL</label>
        <input id="set-baseurl-2" type="text" spellcheck="false" placeholder="http://host:port/v1" />
      </div>
      <div class="field">
        <label for="set-apikey-2">API key</label>
        <input id="set-apikey-2" type="password" spellcheck="false" placeholder="anything, if your server accepts it" />
      </div>
      <div class="field">
        <label for="set-model-2">Model</label>
        <input id="set-model-2" type="text" spellcheck="false" placeholder="model-name" />
      </div>
    </div>
    <div class="field">
      <label for="set-maxlength">Summary length</label>
      <select id="set-maxlength">
        <option value="short">Short</option>
        <option value="medium">Medium</option>
        <option value="long">Long</option>
      </select>
    </div>
    <div class="save-row">
      <button id="btn-save">Save settings</button>
      <span id="save-note" class="hidden">Saved.</span>
    </div>
  </details>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/DOMPurify.min.js"></script>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
